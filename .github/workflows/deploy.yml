name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      # Workaround: deploy-pages@v4 lists the just-uploaded "github-pages" artifact
      # via the Actions API, which intermittently returns 0 artifacts right after
      # upload ("Found 0 artifact(s)" / "Fetching artifact metadata failed"),
      # failing the deploy even though the artifact exists. Wait for the artifact
      # index to become visible before deploying.
      - name: Wait for artifact to become visible
        run: sleep 45
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
